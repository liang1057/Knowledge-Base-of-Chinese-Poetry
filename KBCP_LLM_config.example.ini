; KBCP 智能打标签 - LLM 提供者配置模板
; 复制为 KBCP_LLM_config.ini 并填写 API Key
; 注意: 不要将含 Key 的 config.ini 提交到 Git

[provider]
; 可选: ollama, deepseek, zhipu
default = ollama

[ollama]
; Ollama 本地服务地址
url = http://localhost:11434/api/chat
; 本地模型名称（通过 ollama list 查看）
model = deepseek-r1:8b

[deepseek]
; DeepSeek API Key (https://platform.deepseek.com/api_keys)
api_key = sk-your-deepseek-api-key-here
; 模型名称
model = deepseek-chat
; API 端点（无需修改）
base_url = https://api.deepseek.com/v1/chat/completions

[zhipu]
; 智谱 API Key (https://open.bigmodel.cn/usercenter/apikeys)
api_key = your-zhipu-api-key-here
; 模型名称 (glm-4-flash / glm-4-plus / glm-4-air)
model = glm-4-flash

[common]
; 请求间隔（秒），云 API 可设更小如 0.2
request_interval = 0.3
; 每首诗发送给 LLM 的最大字符数
max_content_len = 600
