; KBCP 智能打标签 + 问答助手 - LLM 提供者配置
; 请在此文件中填写你的 API Key

[provider]
default = ollama

[ollama]
url = http://localhost:11434/api/chat
model = deepseek-r1:8b

[deepseek]
api_key = sk-5922b6605abe41bbaf718d875a4ae43a
model = deepseek-chat
base_url = https://api.deepseek.com/v1/chat/completions

[zhipu]
api_key = bef68ef88c234fffabd16dcf82b9b940.RF5jQMd9esDmKV8h
model = glm-4.7-flash
base_url = https://open.bigmodel.cn/api/paas/v4/chat/completions

[sql]
; SQL 生成专用配置 — 优先使用非推理、快速的云模型，避免 deepseek-r1 的 <think> 包装与慢速
llm_provider = zhipu, deepseek, ollama

[common]
request_interval = 0.3
max_content_len = 6000

[assistant]
; 问答助手配置
; 标签语义匹配阈值 (0-1)，低于此值则降级到 LLM
tag_match_threshold = 0.55
; LLM 提供者（用于降级时理解问题，多个用逗号分隔按优先级尝试）
; 例如: llm_provider = ollama, deepseek, zhipu
llm_provider = ollama, zhipu, deepseek
; LLM 降级时使用的模型（默认 ollama 本地模型）
; llm_model = deepseek-r1:8b
; 单次查询最多返回诗词数
max_results = 20

[agent]
; ============================================================
; Agent 中枢配置（LLM 当大脑，工具调用 + RAG 工具）
; ============================================================
; llm_provider 顺序【必须】在此填写，代码不写死任何顺序。
; 注意：本地 ollama/deepseek-r1 不支持 function calling，会被自动过滤掉，
;       此处应只放支持 function calling 的云模型（deepseek / zhipu）。
; 顺序即优先级，从左到右依次尝试，上一个不可用则降级下一个。
llm_provider = deepseek, zhipu

; 近义理解开关（CLI 模式兜底用；Web 模式以 KBCP_web/config.py 的 LLM_NEAR_SYNONYM 为准）
; True = 让 LLM 参与主题词近义扩展；False = 仅 vocab 确定性映射
llm_near_synonym = True
