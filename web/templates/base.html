<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}诗词库{% endblock %}</title>
    
    <!-- 第三方库 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='lib/bootstrap/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='lib/jstree/themes/default/style.min.css') }}">
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book-poetry"></i> 诗词库
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-home"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/manage">
                            <i class="fas fa-cog"></i> 内容管理
                        </a>
                    </li>
                </ul>
                <!-- 搜索框 -->
                <form class="d-flex" id="searchForm">
                    <input class="form-control me-2" type="search" placeholder="搜索诗词/作者..." id="searchInput">
                    <button class="btn btn-outline-light" type="submit">
                        <i class="fas fa-search"></i>
                    </button>
                </form>
            </div>
        </div>
    </nav>
    
    <!-- 统计栏 -->
    <div class="stats-bar">
        <div class="container-fluid">
            <span class="stat-item">
                <i class="fas fa-landmark"></i> <span id="dynastyCount">-</span> 个朝代
            </span>
            <span class="stat-item">
                <i class="fas fa-user"></i> <span id="authorCount">-</span> 位作者
            </span>
            <span class="stat-item">
                <i class="fas fa-scroll"></i> <span id="poemCount">-</span> 首诗词
            </span>
        </div>
    </div>
    
    <!-- 主内容区 -->
    {% block content %}{% endblock %}
    
    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <span class="text-muted">诗词库网站 &copy; 2026 | 基于知识库诗词数据</span>
        </div>
    </footer>
    
    <!-- 第三方库脚本 -->
    <script src="{{ url_for('static', filename='lib/jquery/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='lib/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='lib/jstree/jstree.min.js') }}"></script>
    
    <!-- 通用脚本 -->
    <script>
        // 加载统计数据
        function loadStats() {
            $.get('/api/stats', function(data) {
                $('#dynastyCount').text(data.dynasty_count);
                $('#authorCount').text(data.author_count);
                $('#poemCount').text(data.poem_count);
            });
        }
        
        // 搜索功能
        $('#searchForm').on('submit', function(e) {
            e.preventDefault();
            const keyword = $('#searchInput').val().trim();
            if (keyword) {
                window.location.href = '/?search=' + encodeURIComponent(keyword);
            }
        });
        
        // 页面加载时获取统计
        $(document).ready(function() {
            loadStats();
        });
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
